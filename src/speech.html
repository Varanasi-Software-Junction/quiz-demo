<head>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 5px;
        }

        .dialogue-box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;

        }

<body>
    <button onclick="crx_speakAll()">Speak All</button>
    <button onclick="crx_speak('Hello Champak',0,3000)">Speaker 1</button>

    <h1>Alternating Speakers Demo</h1>
    <button id="start-btn">Start Conversation</button>
    <div class="dialogue-box">

    </div>

    <textarea style="display:none;" id="txt">
